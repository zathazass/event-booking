[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-booking"
description = "Event booking application (learning project)"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [

]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "mypy>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

# ------- pytest ---------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=event_booking --cov-report=term-missing"

# ------- ruff -----------
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear (likely bugs)
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "N",        # naming
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # allow assert in tests if you add "S" later

# ---------- mypy ----------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true